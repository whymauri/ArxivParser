[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-maps"
version = "0.1.0"
description = "Simple and effective manifold approximators (UMAP, TriMap, PaCMAP) with few dependencies"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7"]
bench = ["scikit-learn", "umap-learn", "trimap", "pacmap"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
